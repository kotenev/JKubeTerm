site_name: JKubeTerm — Architecture
site_description: >-
  Detailed architectural documentation for JKubeTerm, a cross-platform JavaFX
  desktop Kubernetes client (Linux/macOS, Java 21) built on the Fabric8
  Kubernetes client.
copyright: JKubeTerm 0.1.0 — internal architecture documentation

theme:
  name: material
  features:
    - content.code.copy
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    scheme: slate
    primary: indigo
    accent: light blue

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - plantuml_markdown:
      servers:
        - url: http://localhost:8080
      format: svg
      http_method: GET
      base_dir: docs
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - css/sidebar-toggle.css
  - css/diagram-zoom.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - js/mermaid-init.js
  - js/sidebar-toggle.js
  - js/diagram-zoom.js

exclude_docs: |
  models/*

nav:
  - Home: index.md
  - UI Wireframe: ui-wireframe.md
  - Architecture:
      - Overview: architecture/overview.md
      - Components & modules: architecture/components.md
      - Data flow & sequences: architecture/data-flow.md
      - Threading model: architecture/threading.md
      - Kubeconfig & authentication: architecture/kubeconfig.md
      - External tool integration: architecture/external-tools.md
      - Resource catalog: architecture/resources.md
      - Architecture decisions: architecture/decisions.md
  - Diagrams:
      - Notation guide: diagrams/index.md
      - PlantUML: diagrams/plantuml.md
      - Mermaid: diagrams/mermaid.md
      - Archi (ArchiMate): diagrams/archi.md
      - Structurizr (C4): diagrams/structurizr.md
  - Development:
      - Build & packaging: development/build.md
      - Testing: development/testing.md
  - Guides:
      - QuickStart — minikube home lab: guides/quickstart-minikube.md
      - User guide: guides/user-guide.md
      - Admin guide: guides/admin-guide.md
  - Training:
      - Course map: training/index.md
      - 01 Basics: training/01-basics.md
      - 02 Cluster: training/02-cluster.md
      - 03 Access: training/03-access.md
      - 04 Workloads I: training/04-workloads.md
      - 05 Services & Ingress: training/05-services-ingress.md
      - 06 Config & Storage: training/06-config-storage.md
      - 07 Workloads II: training/07-advanced-workloads.md
      - 08 Observability: training/08-observability.md
      - 09 Helm & GitOps: training/09-helm-gitops.md
      - 10 Security: training/10-security.md
      - 11 Troubleshooting: training/11-troubleshooting.md
      - 12 Demo apps: training/12-demo-apps.md
  - Best Practices book:
      - Book index: best-practices/index.md
      - Pods: best-practices/01-pod.md
      - Deployments: best-practices/02-deployment.md
      - StatefulSets: best-practices/03-statefulset.md
      - DaemonSets: best-practices/04-daemonset.md
      - Services: best-practices/05-service.md
      - ConfigMaps: best-practices/06-configmap.md
      - Jobs: best-practices/07-job.md
      - CronJobs: best-practices/08-cronjob.md
      - Ingresses: best-practices/09-ingress.md
      - PVCs: best-practices/10-pvc.md
      - Events: best-practices/11-events.md
      - Nodes: best-practices/12-node.md
      - Namespaces: best-practices/13-namespace.md
      - PersistentVolumes: best-practices/14-pv.md
  - Operations:
      - Security: operations/security.md
      - Roadmap: operations/roadmap.md
